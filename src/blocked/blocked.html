<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steer Clear</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body class="layout-center">
    <main class="card" id="card">
      <aside class="notice" id="variation-notice" hidden>
        <p class="notice-text">
          This screen changes a little each time, so it stays noticeable.
        </p>
        <div class="notice-actions">
          <button class="btn btn-ghost" id="notice-ok" type="button">Got it</button>
          <a
            class="notice-link"
            id="notice-settings"
            href="../options/options.html#vary-presentation"
            target="_blank"
            rel="noopener"
          >Turn this off in Settings</a>
        </div>
      </aside>

      <div class="message">
        <header class="intro">
          <p class="eyebrow" id="lead">You were heading to</p>
          <h1 class="host" id="host">&nbsp;</h1>
        </header>

        <section class="reason" id="reason" hidden>
          <p class="reason-lead" id="reason-lead"></p>
          <blockquote class="note" id="note"></blockquote>
        </section>

        <section class="exercise" id="exercise" hidden></section>
      </div>

      <div class="choices">
        <div class="countdown" id="countdown" hidden>
          <p class="countdown-text">
            Going to <strong id="countdown-target"></strong> in
            <span class="countdown-seconds" id="countdown-seconds"></span>
          </p>
          <button class="btn btn-ghost" id="stop" type="button">Stop</button>
        </div>

        <a class="btn btn-primary choice-go" id="go-target" href="#">
          <span id="go-target-label">&nbsp;</span>
        </a>

        <div class="choice-continue" id="continue-group">
          <button
            class="btn btn-ghost"
            id="bypass"
            type="button"
            aria-describedby="gate limit-text"
          >
            <span id="bypass-label">&nbsp;</span>
            <span class="btn-sub" id="bypass-minutes"></span>
          </button>
          <p class="gate" id="gate"></p>
          <p class="limit" id="limit" hidden>
            <span id="limit-text"></span>
            <a id="limit-link" href="#" target="_blank" rel="noopener">Change your daily limit</a>
          </p>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <footer class="footer">
        <a href="#" id="open-options">Settings</a>
      </footer>
    </main>

    <script type="module" src="blocked.js"></script>
  </body>
</html>
